# Install only after Certbot has issued a certificate for both domain names.
server {
    listen 80;
    listen [::]:80;
    server_name fdeopen.com www.fdeopen.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fdeopen-acme;
    }
    location / {
        return 301 https://fdeopen.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.fdeopen.com;
    ssl_certificate /etc/letsencrypt/live/fdeopen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fdeopen.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://fdeopen.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fdeopen.com;
    ssl_certificate /etc/letsencrypt/live/fdeopen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fdeopen.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=15552000" always;
    client_max_body_size 12m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3215;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
