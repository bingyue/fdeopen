# Certbot adds the TLS listener after the DNS records resolve to this server.
server {
    listen 80;
    listen [::]:80;
    server_name fdeopen.com www.fdeopen.com;

    client_max_body_size 12m;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fdeopen-acme;
    }

    location / {
        proxy_pass http://127.0.0.1:3215;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # This is the public ingress: discard client-supplied forwarding chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
